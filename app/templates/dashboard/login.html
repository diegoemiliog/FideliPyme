<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FideliPyme</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard/style.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo">&#128272;</div>
        <h1>FideliPyme</h1>
        <p class="subtitle">Panel de Administracion</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('dashboard.login') }}">
            <div class="form-group">
                <label for="password">Contrasena</label>
                <input type="password" id="password" name="password"
                       placeholder="Ingresa la contrasena" autofocus required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Ingresar
            </button>
        </form>
    </div>
</body>
</html>
